<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-feb92b32-f7a6-4366-a007-a629b2f673f7/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  @keyframes dlgIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes bdIn{from{opacity:0}to{opacity:1}}
  .ct-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#5c6a67;margin-bottom:7px;font-family:'IBM Plex Mono',monospace}
  .ct-input{width:100%;border:1px solid #d7dedb;border-radius:10px;background:#fff;padding:10px 12px;font-size:13.5px;font-family:var(--font-body);color:#10201d}
  .ct-input:focus-visible{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.14)}
  .ct-seg{display:flex;gap:6px}
  .ct-pill{flex:1;text-align:center;padding:9px 0;border-radius:9px;border:1px solid #d7dedb;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:#5c6a67;transition:all .12s}
  .ct-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:99px;border:1px solid #d7dedb;background:#fff;cursor:pointer;font-size:12.5px;font-weight:500;color:#3d4a47;transition:all .12s}
  .ct-chip .av{width:22px;height:22px;border-radius:50%;background:#eef1f0;color:#5c6a67;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="position:fixed;inset:0;background:rgba(9,20,17,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:bdIn .18s ease" onClick="{{ onBackdropClick }}">
  <div style="width:600px;max-width:100%;max-height:90vh;background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(9,20,17,.35);display:flex;flex-direction:column;overflow:hidden;animation:dlgIn .22s ease" onClick="{{ stop }}">

    <div style="display:flex;align-items:center;gap:14px;padding:22px 26px;border-bottom:1px solid #eef1f0">
      <div style="width:44px;height:44px;flex:none;border-radius:12px;background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--font-heading);font-weight:700;font-size:18px;letter-spacing:-.01em">Create task</div>
        <div style="font-size:12.5px;color:#5c6a67;margin-top:1px">Fill in the details, assign owners, and attach files.</div>
      </div>
      <button onClick="{{ cancel }}" style="width:34px;height:34px;flex:none;border-radius:9px;border:1px solid #e3e8e6;background:#fff;color:#5c6a67;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="padding:22px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:20px">

      <div>
        <div class="ct-label">Task title</div>
        <input class="ct-input" value="{{ draft.title }}" onChange="{{ onTitle }}" placeholder="e.g. Draft Q3 rollout plan"/>
      </div>
      <div>
        <div class="ct-label">Description</div>
        <textarea class="ct-input" style="min-height:78px;resize:vertical" value="{{ draft.description }}" onChange="{{ onDescription }}" placeholder="What needs to happen?"></textarea>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div class="ct-label">Team</div>
          <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ true }}">
            <select class="ct-input" value="{{ draft.team }}" onChange="{{ onTeam }}">
              <sc-for list="{{ teamOptions }}" as="o" hint-placeholder-count="4">
                <option value="{{ o.value }}">{{ o.label }}</option>
              </sc-for>
            </select>
          </sc-if>
          <sc-if value="{{ isUser }}" hint-placeholder-val="{{ false }}">
            <input class="ct-input" style="background:#f4f6f5;color:#5c6a67" value="{{ fixedTeamLabel }}" disabled="{{ true }}"/>
          </sc-if>
        </div>
        <div>
          <div class="ct-label">Due date</div>
          <input class="ct-input" type="date" value="{{ draft.dueDate }}" onChange="{{ onDueDate }}"/>
        </div>
        <div>
          <div class="ct-label">Priority</div>
          <div class="ct-seg">
            <sc-for list="{{ priorityPills }}" as="p" hint-placeholder-count="3">
              <div class="ct-pill" style="{{ p.style }}" onClick="{{ p.select }}">{{ p.label }}</div>
            </sc-for>
          </div>
        </div>
        <div>
          <div class="ct-label">Impact</div>
          <div class="ct-seg">
            <sc-for list="{{ impactPills }}" as="p" hint-placeholder-count="3">
              <div class="ct-pill" style="{{ p.style }}" onClick="{{ p.select }}">{{ p.label }}</div>
            </sc-for>
          </div>
        </div>
      </div>

      <div>
        <div class="ct-label">Assignees</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ assigneeChoices }}" as="a" hint-placeholder-count="4">
            <div class="ct-chip" style="{{ a.style }}" onClick="{{ a.toggle }}">
              <span class="av" style="{{ a.avStyle }}">{{ a.initials }}</span>{{ a.name }}
            </div>
          </sc-for>
        </div>
      </div>

      <div>
        <div class="ct-label">Subtasks</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ subtaskRows }}" as="st" hint-placeholder-count="0">
            <div style="display:flex;flex-direction:column;gap:7px;border:1px solid #eef1f0;border-radius:11px;padding:9px 10px">
              <div style="display:flex;gap:8px">
                <input class="ct-input" value="{{ st.title }}" onChange="{{ st.updateTitle }}" placeholder="Subtask title" style="flex:1"/>
                <button onClick="{{ st.remove }}" style="width:38px;flex:none;border:1px solid #e3e8e6;border-radius:10px;background:#fff;color:#8a968f;cursor:pointer;display:flex;align-items:center;justify-content:center">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                <sc-for list="{{ st.assigneeChips }}" as="a" hint-placeholder-count="3">
                  <div class="ct-chip" style="{{ a.style }}" onClick="{{ a.toggle }}">
                    <span class="av" style="{{ a.avStyle }}">{{ a.initials }}</span>{{ a.name }}
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
          <button onClick="{{ addSubtask }}" style="align-self:flex-start;border:1px dashed #b6c3be;border-radius:9px;background:#f8faf9;color:#3d4a47;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-body)">+ Add subtask</button>
        </div>
      </div>

      <div>
        <div class="ct-label">Attachments</div>
        <sc-for list="{{ attachmentRows }}" as="f" hint-placeholder-count="0">
          <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #e3e8e6;border-radius:10px;margin-bottom:8px;background:#f8faf9">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6"><path d="M14 3v5h5"></path><path d="M6 3h8l5 5v13H6z"></path></svg>
            <span style="font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ f.name }}</span>
            <button onClick="{{ f.remove }}" style="margin-left:auto;border:none;background:none;color:#b91c1c;cursor:pointer;font-size:11px;font-weight:600">Remove</button>
          </div>
        </sc-for>
        <label style="display:flex;align-items:center;justify-content:center;gap:9px;border:1.5px dashed #b6c3be;border-radius:12px;padding:20px;cursor:pointer;color:#2563eb;font-size:13px;font-weight:600;background:#f8faf9">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 17v3h16v-3"></path></svg>
          Click to upload a file for assignees
          <input type="file" style="display:none" onChange="{{ onUpload }}"/>
        </label>
      </div>

    </div>

    <div style="display:flex;justify-content:flex-end;gap:10px;padding:18px 26px;border-top:1px solid #eef1f0;background:#fbfcfc">
      <button onClick="{{ cancel }}" style="border:1px solid #d7dedb;border-radius:10px;background:#fff;color:#3d4a47;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body)">Cancel</button>
      <button onClick="{{ submit }}" style="border:none;border-radius:10px;background:#2563eb;color:#fff;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);box-shadow:0 4px 12px rgba(37,99,235,.3)">Create task</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const cap = (x) => (x ? x.charAt(0).toUpperCase() + x.slice(1) : '');
const initials = (name) => (name || '?').split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
const LVL_COLOR = { high: ['#fee2e2', '#b91c1c', '#fca5a5'], medium: ['#fef3c7', '#b45309', '#fcd34d'], low: ['#eef1f0', '#5c6a67', '#d7dedb'] };
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const d = p.draft || {};
    const teamLabel = (p.teamOptions || []).find(o => o.value === d.team);
    const pills = (current, field) => ['high', 'medium', 'low'].map(k => {
      const on = current === k;
      const [bg, fg, bd] = LVL_COLOR[k];
      return { label: cap(k), select: () => p.update(field, k), style: on ? `background:${bg};color:${fg};border-color:${bd}` : '' };
    });
    const assigneeChoices = (p.assigneeChoices || []).map(a => ({
      ...a, initials: initials(a.name),
      style: a.checked ? 'background:#eff6ff;border-color:#2563eb;color:#1e3a8a' : '',
      avStyle: a.checked ? 'background:#2563eb;color:#fff' : '',
    }));
    const subtaskRows = (p.subtaskRows || []).map(st => ({
      ...st,
      assigneeChips: (st.assigneeChips || []).map(a => ({
        ...a, initials: initials(a.name),
        style: a.checked ? 'background:#eff6ff;border-color:#2563eb;color:#1e3a8a' : '',
        avStyle: a.checked ? 'background:#2563eb;color:#fff' : '',
      })),
    }));
    const attachmentRows = (p.attachments || []).map(f => ({ ...f, remove: () => p.removeAttachment(f.name) }));
    return {
      isAdmin: p.isAdmin, isUser: !p.isAdmin, draft: d, teamOptions: p.teamOptions,
      fixedTeamLabel: teamLabel ? teamLabel.label : '',
      assigneeChoices, subtaskRows,
      priorityPills: pills(d.priority, 'priority'), impactPills: pills(d.impact, 'impact'),
      attachmentRows,
      onTitle: (e) => p.update('title', e), onDescription: (e) => p.update('description', e),
      onTeam: (e) => p.update('team', e), onDueDate: (e) => p.update('dueDate', e),
      onUpload: (e) => { const f = e.target.files && e.target.files[0]; if (f && p.addAttachment) p.addAttachment(f.name); },
      addSubtask: p.addSubtask, submit: p.submit, cancel: p.cancel,
      onBackdropClick: p.cancel, stop: (e) => e.stopPropagation(),
    };
  }
}

</script>
</body>
</html>
