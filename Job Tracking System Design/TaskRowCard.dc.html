<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/industry-feb92b32-f7a6-4366-a007-a629b2f673f7/styles.css">
<style>
@keyframes bellRing{0%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}
.follow-btn:hover .bell-ic{animation:bellRing .7s ease both;transform-origin:50% 12%}
@keyframes starPop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
.star-btn:hover .star-ic{animation:starPop .5s ease both}
</style>
</helmet>
<div onClick="{{ open }}" style="display:flex;align-items:center;gap:16px;border:1px solid #e3e8e6;border-left:4px solid {{ bandColor }};border-radius:12px;background:#fff;padding:14px 18px;cursor:pointer;transition:box-shadow .16s ease,transform .14s ease,border-color .16s ease" style-hover="box-shadow:0 8px 22px rgba(10,30,26,.12);transform:translateY(-2px)">
  <div style="min-width:0;flex:1">
    <div style="font-weight:600;font-size:14px;color:#10201d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ task.title }}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:#5c6a67">
      <span>{{ task.teamName }}</span>
      <span style="opacity:.4">•</span>
      <span>{{ task.assigneeSummary }}</span>
      <sc-if value="{{ task.hasSubtasks }}" hint-placeholder-val="{{ false }}">
        <span style="opacity:.4">•</span>
        <span>{{ task.subtaskDoneCount }}/{{ task.subtaskTotal }} subtasks</span>
      </sc-if>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex:none;width:132px;justify-content:flex-start">
    <span class="badge {{ task.priorityLvlClass }}">{{ task.priorityLabel }}</span>
    <span class="badge {{ task.impactLvlClass }}">{{ task.impactLabel }}</span>
  </div>
  <div style="width:110px;flex:none;text-align:right">
    <div style="font-family:var(--font-mono);font-size:12px;color:#3d4a47">{{ task.dueLabel }}</div>
    <sc-if value="{{ task.overdue }}" hint-placeholder-val="{{ false }}"><div style="font-size:10.5px;color:#b91c1c;font-weight:600;margin-top:2px">Overdue</div></sc-if>
  </div>
  <sc-if value="{{ hasRowAction }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ onRowAction }}" title="{{ rowActionLabel }}" aria-label="{{ rowActionLabel }}" class="follow-btn" style="flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid {{ rowActionColor }};color:{{ rowActionColor }};background:#fff;border-radius:9px;cursor:pointer" style-hover="background:{{ rowActionTint }}">
      <svg class="bell-ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
    </button>
  </sc-if>
  <sc-if value="{{ hasRowEdit }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ onRowEdit }}" title="Edit task" aria-label="Edit task" class="row-edit" style="flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid #bfdbfe;color:#2563eb;background:#fff;border-radius:9px;cursor:pointer" style-hover="background:#eff6ff">
      <svg class="edit-glyph" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </button>
  </sc-if>
  <sc-if value="{{ hasRowDelete }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ onRowDelete }}" title="Delete task" aria-label="Delete task" class="row-del" style="flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid #fca5a5;color:#b91c1c;background:#fff;border-radius:9px;cursor:pointer" style-hover="background:#fef2f2">
      <svg class="del-glyph" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg>
    </button>
  </sc-if>
  <button onClick="{{ onStar }}" title="{{ starTitle }}" aria-label="{{ starTitle }}" class="star-btn" style="flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid {{ starBorder }};background:{{ starBg }};border-radius:9px;cursor:pointer" style-hover="border-color:#eab308;background:#fffbeb">
    <svg class="star-ic" width="17" height="17" viewBox="0 0 24 24" fill="{{ starFill }}" stroke="{{ starStroke }}" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.3l6.1-.7z"></path></svg>
  </button>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b6c0bc" stroke-width="2" style="flex:none"><path d="M9 6l6 6-6 6"></path></svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const LVL = { high: 'lvl-high', medium: 'lvl-med', low: 'lvl-low' };
const cap = (x) => (x ? x.charAt(0).toUpperCase() + x.slice(1) : '');
class Component extends DCLogic {
  renderVals() {
    const t = this.props.task || {};
    const names = t.assigneeNames || [];
    return {
      task: {
        ...t,
        priorityLvlClass: LVL[t.priority] || 'lvl-low', priorityLabel: cap(t.priority),
        impactLvlClass: LVL[t.impact] || 'lvl-low', impactLabel: cap(t.impact),
        hasSubtasks: t.subtasks && t.subtasks.length > 0, subtaskTotal: t.subtasks ? t.subtasks.length : 0,
        assigneeSummary: names.length > 1 ? names[0] + ' +' + (names.length - 1) : (names[0] || '—'),
      },
      bandColor: t.stripColor || this.props.bandColor || '#2563eb',
      open: t.openThis || (() => {}),
      hasRowAction: !!t.rowAction,
      rowActionLabel: t.rowAction ? t.rowAction.label : '',
      rowActionColor: t.rowAction ? t.rowAction.color : '#5c6a67',
      rowActionTint: t.rowAction ? (t.rowAction.color + '14') : 'transparent',
      onRowAction: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (t.rowAction) t.rowAction.onClick(); },
      hasRowEdit: !!t.rowEdit,
      onRowEdit: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (t.rowEdit) t.rowEdit(); },
      hasRowDelete: !!t.rowDelete,
      onRowDelete: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (t.rowDelete) t.rowDelete(); },
      onStar: t.toggleStar || (() => {}),
      starTitle: t.starred ? 'Unpin task' : 'Pin task',
      starFill: t.starred ? '#f4b400' : 'none',
      starStroke: t.starred ? '#e0a000' : '#b6c0bc',
      starBorder: t.starred ? '#fde68a' : '#e3e8e6',
      starBg: t.starred ? '#fffbeb' : '#fff',
    };
  }
}

</script>
</body>
</html>
