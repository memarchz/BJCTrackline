<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-feb92b32-f7a6-4366-a007-a629b2f673f7/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>@keyframes dlgIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes bdIn{from{opacity:0}to{opacity:1}}</style>
</helmet>
<div style="border:1px solid #e3e8e6;border-radius:16px;background:#fff;overflow:hidden">
  <div style="display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #eef1f0;background:#2563eb;color:#fff">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
    <div style="font-family:var(--font-heading);font-weight:700;font-size:16px">{{ monthLabel }}</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11px;color:rgba(255,255,255,.85)">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#93c5fd"></span>Tasks due</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#fbbf24"></span>Note</span>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #eef1f0;background:#f8faf9">
    <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7">
      <div style="padding:10px 0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:{{ w.color }}">{{ w.label }}</div>
    </sc-for>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr)">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
      <div style="min-height:92px;border-right:1px solid #f4f6f5;border-bottom:1px solid #f4f6f5;border-top:2px solid {{ c.topBar }};padding:8px;cursor:{{ c.cursor }};background:{{ c.bg }};display:flex;flex-direction:column;gap:5px;transition:background .16s ease" onClick="{{ c.open }}" style-hover="{{ c.hoverStyle }}">
        <sc-if value="{{ c.isDay }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="{{ c.numStyle }}">{{ c.day }}</span>
            <sc-if value="{{ c.hasNote }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></sc-if>
          </div>
          <sc-if value="{{ c.hasTasks }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:3px">
              <sc-for list="{{ c.chips }}" as="ch" hint-placeholder-count="1">
                <div style="font-size:10px;background:{{ ch.bg }};color:{{ ch.color }};border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500">{{ ch.title }}</div>
              </sc-for>
              <sc-if value="{{ c.hasMore }}" hint-placeholder-val="{{ false }}"><div style="font-size:9.5px;color:#96a19d;font-family:'IBM Plex Mono',monospace">+{{ c.moreCount }} more</div></sc-if>
            </div>
          </sc-if>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>

<sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;background:rgba(9,20,17,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:bdIn .18s ease" onClick="{{ closeModal }}">
    <div style="width:440px;max-width:100%;max-height:86vh;background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(9,20,17,.35);display:flex;flex-direction:column;overflow:hidden;animation:dlgIn .22s ease" onClick="{{ stop }}">
      <div style="display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid #eef1f0">
        <div style="width:48px;height:48px;flex:none;border-radius:12px;background:#eff6ff;color:#1e3a8a;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#2563eb">{{ modal.mon }}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:19px">{{ modal.day }}</span>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--font-heading);font-weight:700;font-size:16px">{{ modal.weekdayLong }}</div>
          <div style="font-size:12px;color:#96a19d">{{ modal.taskCount }} task(s) due</div>
        </div>
        <button onClick="{{ closeModal }}" style="width:32px;height:32px;flex:none;border-radius:9px;border:1px solid #e3e8e6;background:#fff;color:#5c6a67;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px">
        <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#96a19d;margin-bottom:10px">Tasks due</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <sc-for list="{{ modal.tasks }}" as="t" hint-placeholder-count="2">
              <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eef1f0;border-radius:10px;cursor:pointer" onClick="{{ t.open }}" style-hover="background:#f8faf9">
                <span style="width:8px;height:8px;border-radius:50%;background:{{ t.dot }};flex:none"></span>
                <div style="min-width:0;flex:1">
                  <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.title }}</div>
                  <div style="font-size:10.5px;color:#96a19d">{{ t.statusLabel }}</div>
                </div>
                <span class="badge {{ t.priorityLvlClass }}">{{ t.priorityLabel }}</span>
              </div>
            </sc-for>
            <sc-if value="{{ modal.noTasks }}" hint-placeholder-val="{{ true }}">
              <div style="border:1px dashed #cdd7d3;border-radius:10px;padding:16px;text-align:center;color:#96a19d;font-size:12.5px">No tasks due this day.</div>
            </sc-if>
          </div>
        </div>
        <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#96a19d;margin-bottom:10px">My note</div>
          <textarea style="width:100%;min-height:96px;resize:vertical;border:1px solid #d7dedb;border-radius:10px;padding:11px 13px;font-size:13px;font-family:var(--font-body);color:#10201d" placeholder="Jot a note for this day…" value="{{ modal.note }}" onChange="{{ onNote }}"></textarea>
        </div>
      </div>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const LVL = { high: 'badge lvl-high', medium: 'badge lvl-med', low: 'badge lvl-low' };
const STLABEL = { todo: 'To Do', in_progress: 'In Progress', submitted: 'Submitted', rejected: 'Rejected', completed: 'Completed' };
const STDOT = { todo: '#96a19d', in_progress: '#0284c7', submitted: '#d97706', rejected: '#b91c1c', completed: '#15803d' };
const cap = (x) => (x ? x.charAt(0).toUpperCase() + x.slice(1) : '');
const NOTE_KEY = 'jobtracker_day_notes';
const YEAR = 2026, MONTH = 6, TODAY_DAY = 26; // July 2026

class Component extends DCLogic {
  state = { notes: {}, openDate: null };
  componentDidMount() {
    try { const raw = localStorage.getItem(NOTE_KEY); if (raw) this.setState({ notes: JSON.parse(raw) }); } catch (e) {}
  }
  key(day) { return `${YEAR}-${String(MONTH + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; }
  openDay = (day) => this.setState({ openDate: day });
  closeModal = () => this.setState({ openDate: null });
  onNote = (e) => {
    const v = e.target.value, k = this.key(this.state.openDate);
    this.setState(s => { const notes = { ...s.notes, [k]: v }; try { localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); } catch (er) {} return { notes }; });
  };

  tasksOn(day) {
    const k = this.key(day);
    return (this.props.tasks || []).filter(t => t.dueDate === k);
  }

  renderVals() {
    const first = new Date(YEAR, MONTH, 1).getDay();
    const daysIn = new Date(YEAR, MONTH + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < first; i++) cells.push({ isDay: false, cursor: 'default', bg: '#fbfcfc', hoverStyle: '', topBar: 'transparent', open: () => {} });
    for (let d = 1; d <= daysIn; d++) {
      const tasks = this.tasksOn(d);
      const isToday = d === TODAY_DAY;
      const hasNote = !!(this.state.notes[this.key(d)] || '').trim();
      const dow = new Date(YEAR, MONTH, d).getDay();
      const weekend = dow === 0 || dow === 6;
      const hasOverdueOrHigh = tasks.some(t => t.priority === 'high');
      const chips = tasks.slice(0, 2).map(t => ({ title: t.title, bg: t.status === 'completed' ? '#dcfce7' : t.status === 'rejected' ? '#fee2e2' : t.status === 'submitted' ? '#fef3c7' : '#dbeafe', color: t.status === 'completed' ? '#14532d' : t.status === 'rejected' ? '#7f1d1d' : t.status === 'submitted' ? '#92400e' : '#1e3a8a' }));
      const bg = isToday ? '#eff6ff' : tasks.length ? '#f6faff' : hasNote ? '#fffdf5' : weekend ? '#fcfdfc' : '#fff';
      const topBar = tasks.length ? (hasOverdueOrHigh ? '#dc2626' : '#2563eb') : (hasNote ? '#f59e0b' : 'transparent');
      cells.push({
        isDay: true, day: d, cursor: 'pointer', bg,
        hoverStyle: 'background:#eef4fb', topBar,
        numStyle: isToday ? 'width:24px;height:24px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-weight:600;font-size:12px' : 'font-family:\'IBM Plex Mono\',monospace;font-weight:600;font-size:13px;color:' + (weekend ? '#b91c1c' : '#3d4a47') + ';padding-left:2px',
        hasNote, hasTasks: tasks.length > 0, chips, hasMore: tasks.length > 2, moreCount: tasks.length - 2,
        open: () => this.openDay(d),
      });
    }

    const od = this.state.openDate;
    let modal = {};
    if (od != null) {
      const tasks = this.tasksOn(od).map(t => ({ ...t, statusLabel: STLABEL[t.status] || t.status, dot: STDOT[t.status] || '#96a19d', priorityLvlClass: LVL[t.priority] || 'badge lvl-low', priorityLabel: cap(t.priority), open: t.openThis || (() => {}) }));
      const dObj = new Date(YEAR, MONTH, od);
      modal = { day: od, mon: MON[MONTH], weekdayLong: WDL[dObj.getDay()], taskCount: tasks.length, tasks, noTasks: tasks.length === 0, note: this.state.notes[this.key(od)] || '' };
    }

    return {
      monthLabel: MONL[MONTH] + ' ' + YEAR, weekdays: WD.map((w, i) => ({ label: w, color: (i === 0 || i === 6) ? '#b91c1c' : '#96a19d' })), cells,
      modalOpen: od != null, modal, closeModal: this.closeModal, onNote: this.onNote, stop: (e) => e.stopPropagation(),
    };
  }
}

</script>
</body>
</html>
